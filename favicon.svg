<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>互为负形 · 消耗与恢复</title>
  <defs>
    <linearGradient id="slab" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#14151b"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="24" y1="32" x2="66" y2="68">
      <stop offset="0" stop-color="#f6e6ae"/>
      <stop offset="0.55" stop-color="#d6b163"/>
      <stop offset="1" stop-color="#a07c2e"/>
    </linearGradient>
    <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="40" y1="26" x2="80" y2="62">
      <stop offset="0" stop-color="#bccbe1"/>
      <stop offset="1" stop-color="#6d7f9c"/>
    </linearGradient>
    <mask id="cutGold" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="58" cy="46" r="23" fill="#000"/>
    </mask>
    <mask id="cutSilver" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="44" cy="48" r="23" fill="#000"/>
    </mask>
  </defs>

  <rect width="100" height="100" rx="20" fill="url(#slab)"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="44" cy="48" r="23" fill="url(#gold)" mask="url(#cutGold)"/>
  <circle cx="58" cy="46" r="23" fill="url(#silver)" mask="url(#cutSilver)"/>
</svg>
