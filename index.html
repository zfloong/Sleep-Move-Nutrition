<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狂野生长</title>
    <meta name="theme-color" content="#050507">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preload" as="image" href="assets/intro-bg.webp">
    <link rel="preload" as="image" href="assets/home-bg.webp">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/remixicon/remixicon.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/wild.css">
</head>
<body>

    <!-- 开场白：Apple 语法——场景先在，三句哲思后浮，4.5s 淡出进主页 -->
    <div class="intro-overlay" id="introOverlay">
        <div class="intro-lines">
            <p class="intro-line" data-line="1">Remove the harm.</p>
            <p class="intro-line" data-line="2">Apply the stress.</p>
            <p class="intro-line" data-line="3">Let what recovers recover.</p>
        </div>
    </div>

    <div class="wild-wrapper">

        <div class="wild-dashboard">

            <!-- 运动板块（第一章）：今天唯一要做决定的地方 -->
            <section id="exercise" class="exercise-card guide-card">
            </section>

            <!-- 睡眠板块（第二章） -->
            <section id="sleep" class="sleep-card guide-card">
            </section>

            <!-- 营养板块（第三章） -->
            <section id="nutrition" class="nutrition-card guide-card">
            </section>

        </div>

        <!-- 云同步状态条：由 JS 渲染，未接入时安静退场 -->
        <footer class="sync-bar" id="syncBar" hidden></footer>

    </div>

    <script src="js/content.js"></script>
    <script src="js/view-cards.js"></script>
    <script src="js/wild.js"></script>
</body>
</html>
